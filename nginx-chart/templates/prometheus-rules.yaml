{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nginx.fullname" . }}
  labels:
    {{- include "nginx.labels" . | nindent 4 }}
spec:
  groups:
    - name: nginx.rules
      rules:
        - alert: NginxHighLatency
          expr: histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le, ingress)) > {{ .Values.alerts.latencySeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: NGINX p95 latency is high
            description: NGINX p95 request latency on {{`{{ $labels.instance }}`}} is above the configured threshold.
        - alert: NginxHigh5xxRate
          expr: (sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) / sum(rate(nginx_ingress_controller_requests[5m]))) * 100 > {{ .Values.alerts.errorRatePercent }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: NGINX 5xx error rate is high
            description: NGINX 5xx responses exceed the configured threshold.
{{- end }}
