replicaCount: 3

image:
  repository: nginx
  tag: "1.27.1-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  metricsPort: 9113

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: nginx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example:
  # tls:
  #   - secretName: nginx-tls
  #     hosts:
  #       - nginx.example.com

nginxExporter:
  enabled: true
  image:
    repository: nginx/nginx-prometheus-exporter
    tag: "1.3.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

prometheus:
  scrape: true
  path: /metrics

alerts:
  enabled: false
  latencySeconds: 1
  errorRatePercent: 5
