apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: nginx-platform
spec:
  project: default
  source:
    # Durch die URL des Git-Repositories ersetzen, das dieses Chart enthält.
    repoURL: https://github.com/Bolokada17/nginx-platform.git
    targetRevision: master
    path: nginx-chart
    helm:
      releaseName: nginx
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

