name: Deploy NGINX chart

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Lint chart
        run: helm lint ./nginx-chart
      - name: Deploy
        run: helm upgrade --install nginx ./nginx-chart --namespace nginx-prod --create-namespace --wait

