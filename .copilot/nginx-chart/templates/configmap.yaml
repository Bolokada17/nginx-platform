apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx.fullname" . }}-config
  labels:
    {{- include "nginx.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }

